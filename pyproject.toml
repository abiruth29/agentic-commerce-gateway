[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acg"
version = "0.1.0"
description = "Agentic Commerce Gateway — a trust gateway for agent-initiated payments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
]

[tool.setuptools]
packages = ["acg"]
