[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acg"
version = "0.1.0"
description = "Agentic Commerce Gateway — a trust gateway for agent-initiated payments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
]

# Development only. Never installed in the deployed function.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # required by FastAPI's TestClient
    "ruff==0.16.8",
    # The build backend, needed at test time by tests/test_packaging.py, which
    # asks setuptools what it would collect rather than reimplementing
    # discovery and asserting against a model of it. pip builds in isolation,
    # so the backend declared in [build-system] never lands in the runtime
    # environment and has to be declared here as well.
    "setuptools==80.9.0",
]

# Discovery rather than an explicit list. An explicit list silently omits any
# new subpackage, and editable installs — what CI and local development both
# use — put the source tree on the path and hide the omission, so the first
# symptom is an ImportError in a deployed build.
[tool.setuptools.packages.find]
include = ["acg*"]

# Vercel only auto-detects entrypoints at a few conventional paths (main.py,
# app/main.py, ...). The app lives in a package, so point at it explicitly.
[tool.vercel]
entrypoint = "acg.main:app"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes. I: import order. B: bugbear (likely bugs).
# UP: modern syntax for the target version.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
