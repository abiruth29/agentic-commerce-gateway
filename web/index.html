<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Commerce Gateway</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --fg: #1c1b19;
        --muted: #6b6862;
        --rule: #e0ded9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16150f;
          --fg: #ecebe6;
          --muted: #9a968d;
          --rule: #2e2c26;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 34rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      hr {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 1.5rem 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.875em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agentic Commerce Gateway</h1>
      <p>Under construction.</p>
      <hr />
      <p>
        Stage 0 — walking skeleton. Liveness at <code>/health</code>.
      </p>
    </main>
  </body>
</html>
